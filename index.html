<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HVE Maps — Five Wealth Layers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220;--bg2:#121a2b;--panel:rgba(11,18,32,.94);--text:#f4efe4;--muted:#9aa4b2;
  --gold:#c9a227;--gold2:#e4c56a;--teal:#2a9d8f;--copper:#c26d3a;--line:rgba(201,162,39,.35);
  --font-display:"Cormorant Garamond",Georgia,serif;--font-body:"Source Sans 3",system-ui,sans-serif;
  --header-h:56px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg)}
#header{
  position:absolute;top:0;left:0;right:0;z-index:1000;
  display:flex;flex-wrap:nowrap;gap:8px;align-items:center;
  padding:8px 10px 8px max(10px, env(safe-area-inset-left));
  min-height:var(--header-h);
  background:linear-gradient(180deg,rgba(11,18,32,.98),rgba(11,18,32,.82) 70%,transparent);
}
#header h1{font-family:var(--font-display);font-size:1.15rem;color:var(--gold2);font-weight:600;white-space:nowrap;flex:0 0 auto}
#header h1 span{display:none}
.layers{display:flex;gap:4px;overflow-x:auto;flex:1 1 auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.layers::-webkit-scrollbar{display:none}
.layers button{
  flex:0 0 auto;font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 8px;cursor:pointer;border-radius:2px
}
.layers button.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}
#kind-select,#year-label{font-size:.72rem;background:var(--bg2);color:var(--text);border:1px solid var(--line);padding:5px 6px;flex:0 0 auto}
#year-label{display:none}
#panel{
  position:absolute;z-index:1100;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#panel .handle{display:none}
#panel h2{font-family:var(--font-display);font-size:1.25rem;color:var(--gold2)}
#panel .blurb{color:var(--muted);font-size:.82rem;margin:2px 0 8px}
#panel .stat{font-size:1.35rem;color:var(--teal);font-weight:700}
#list{list-style:none}#list li{padding:7px 0;border-top:1px solid rgba(244,239,228,.08);font-size:.82rem}
#legend-inline{margin:10px 0 8px}
#legend-inline .bar{height:7px;width:100%;max-width:220px;margin:4px 0;background:linear-gradient(90deg,#1b4332,var(--teal),var(--gold),var(--copper))}
#legend-scale{font-size:.7rem;color:var(--muted)}
#foot{font-size:.65rem;color:var(--muted);margin-top:8px}#foot a{color:var(--gold2)}
.leaflet-top.leaflet-left{top:var(--header-h)}
.leaflet-bottom.leaflet-right{margin-bottom:8px}
.leaflet-container{background:#0b1220;font-family:var(--font-body)}
.leaflet-control-attribution{background:rgba(11,18,32,.75)!important;color:var(--muted)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--gold2)!important}

/* Desktop: side dossier */
@media (min-width:821px){
  #header{flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
  #header h1{font-size:1.3rem}
  #header h1 span{display:inline;color:var(--muted);font-family:var(--font-body);font-size:.72rem;margin-left:8px;font-weight:400}
  #year-label{display:inline}
  #panel{top:72px;right:12px;width:340px;max-height:calc(100% - 96px);overflow:auto;padding:14px 16px}
  .leaflet-bottom.leaflet-right{margin-bottom:4px}
}

/* Phone / small tablet: bottom sheet */
@media (max-width:820px){
  #kind-select{max-width:28vw}
  #panel{
    left:0;right:0;bottom:0;top:auto;
    width:100%;border-left:0;border-right:0;border-bottom:0;
    border-radius:16px 16px 0 0;
    padding:6px 16px calc(12px + var(--safe-b));
    max-height:42vh;
    transform:translateY(calc(100% - 92px));
    transition:transform .28s ease, max-height .28s ease;
  }
  #panel.open{transform:translateY(0);max-height:62vh;overflow:auto}
  #panel .handle{
    display:block;width:42px;height:4px;border-radius:4px;background:var(--line);
    margin:4px auto 8px;cursor:pointer;
  }
  #panel header.sheet{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #panel header.sheet .stat{font-size:1.05rem}
  #sheet-toggle{
    border:1px solid var(--line);background:transparent;color:var(--gold2);
    font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;cursor:pointer;
  }
  .leaflet-bottom{bottom:96px}
  .leaflet-control-attribution{max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
</style>
</head>
<body>
<div id="map"></div>
<header id="header">
  <h1>HVE Maps <span>five wealth layers · sovereign placement</span></h1>
  <div class="layers" id="layers"></div>
  <select id="kind-select" aria-label="Metric"></select>
  <span id="year-label"></span>
</header>
<aside id="panel">
  <div class="handle" id="sheet-handle" aria-hidden="true"></div>
  <header class="sheet">
    <div>
      <h2 id="p-title">World</h2>
      <div class="blurb" id="p-blurb">Pick a layer. Tap a country.</div>
    </div>
    <div>
      <div class="stat" id="p-stat"></div>
      <button type="button" id="sheet-toggle">Details</button>
    </div>
  </header>
  <div id="legend-inline">
    <div>Intensity</div>
    <div class="bar"></div>
    <div id="legend-scale"></div>
  </div>
  <ul id="list"></ul>
  <div id="foot">Shell after <a href="https://jlopp.github.io/physical-bitcoin-attacks/">Lopp</a> (Unlicense).
    Data: BTC Map/OSM, Bitnodes, Ember, Tax Foundation, Heritage, World Bank.
    <a href="https://humanvalueexchange.com/">Human Value Exchange</a>.</div>
</aside>
<script>
const LAYERS=[
  {id:"rails",title:"Rails",blurb:"Can you move value here?",file:"data/rails.json",defaultKind:"nodes"},
  {id:"fiscal",title:"Fiscal",blurb:"Is capital allowed to sit?",file:"data/fiscal.json",defaultKind:"property-rights"},
  {id:"energy",title:"Energy",blurb:"Cheap firm watts",file:"data/energy.json",defaultKind:"firm-share"},
  {id:"vitality",title:"Vitality",blurb:"Can a body compound here?",file:"data/vitality.json",defaultKind:"life-expectancy"},
  {id:"timeprice",title:"Time-price",blurb:"What an hour buys",file:"data/timeprice.json",defaultKind:"hours-for-10k-usd"}
];
const NAME_ALIAS={"United States of America":"United States","Russia":"Russian Federation","South Korea":"Korea, Rep.","Egypt":"Egypt, Arab Rep.","Czechia":"Czech Republic"};
let cache={},world=null,current=LAYERS[0],kind=current.defaultKind,countryLayer=null,pointLayer=null,selected=null;
const map=L.map("map",{zoomControl:true,minZoom:2,attributionControl:true});
map.setView([20,10],2);
map.createPane("choro");map.getPane("choro").style.zIndex=300;
map.createPane("pts");map.getPane("pts").style.zIndex=450;
const panel=document.getElementById("panel");
const toggle=document.getElementById("sheet-toggle");
function isPhone(){return window.matchMedia("(max-width:820px)").matches}
function setSheet(open){
  panel.classList.toggle("open",open);
  toggle.textContent=open?"Hide":"Details";
  setTimeout(()=>map.invalidateSize(),300);
}
toggle.onclick=()=>setSheet(!panel.classList.contains("open"));
document.getElementById("sheet-handle").onclick=()=>setSheet(!panel.classList.contains("open"));
function heat(t,worse){const x=worse?1-t:t;const s=[[27,67,50],[42,157,143],[201,162,39],[194,109,58]];const i=Math.min(s.length-2,Math.floor(x*(s.length-1)));const f=x*(s.length-1)-i;const a=s[i],b=s[i+1];return "rgb("+a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(",")+")"}
function normName(s){return s?(NAME_ALIAS[s]||s):""}
async function loadLayer(meta){if(!cache[meta.id]){const raw=await fetch(meta.file).then(r=>r.json());cache[meta.id]=raw.map(r=>({...r,date:r.date||{raw:String(r.year||""),year:r.year},description:r.description||r.label||""}))}return cache[meta.id]}
function kindsFor(recs){return[...new Set(recs.map(r=>r.kind).filter(Boolean))]}
function filtered(recs,k){const b=recs.filter(r=>!k||r.kind===k);return b.length?b:recs}
function countryValues(recs){const acc={};for(const r of recs){if(!r.country||r.kind==="plant"||r.kind==="place")continue;const key=normName(r.country);if(!acc[key])acc[key]={sum:0,n:0,dir:r.direction,unit:r.unit};if(typeof r.value==="number"){acc[key].sum+=r.value;acc[key].n++}}const out={};for(const [k,v] of Object.entries(acc))out[k]={value:v.sum/v.n,dir:v.dir,unit:v.unit};return out}
function extent(vals){const nums=Object.values(vals).map(v=>v.value).filter(Number.isFinite);return nums.length?[Math.min(...nums),Math.max(...nums)]:[0,1]}
function paint(){
  const recs=filtered(cache[current.id]||[],kind);
  const vals=countryValues(recs);
  const [lo,hi]=extent(vals);
  const worse=Object.values(vals)[0]?.dir==="higher-worse";
  document.getElementById("legend-scale").textContent=`${lo.toFixed(1)} → ${hi.toFixed(1)} ${Object.values(vals)[0]?.unit||""}`;
  if(countryLayer)map.removeLayer(countryLayer);
  if(pointLayer)map.removeLayer(pointLayer);
  countryLayer=L.geoJSON(world,{pane:"choro",style:feat=>{
    const name=feat.properties.name;
    const hit=vals[name]||vals[normName(name)]||vals[NAME_ALIAS[name]];
    const t=hit?(hit.value-lo)/(hi-lo||1):null;
    return{color:selected===name?"#f4efe4":"rgba(244,239,228,.25)",weight:selected===name?2:.5,fillColor:t==null?"#1a2233":heat(t,worse),fillOpacity:t==null?.35:.78};
  },onEachFeature:(feat,layer)=>{layer.on("click",()=>{selected=feat.properties.name;openCountry(feat.properties.name,vals,recs);if(isPhone())setSheet(true);paint()})}}).addTo(map);
  const pts=recs.filter(r=>r.lat!=null&&r.lng!=null);
  pointLayer=L.layerGroup();
  const maxV=Math.max(1,...pts.map(p=>p.value||1));
  for(const p of pts){
    L.circleMarker([p.lat,p.lng],{pane:"pts",radius:Math.min(4+12*Math.sqrt((p.value||1)/maxV),16),color:"#c9a227",fillColor:"#c9a227",fillOpacity:.35,weight:1})
      .bindPopup(`<b>${p.label}</b><br>${p.value??""} ${p.unit||""}`).addTo(pointLayer);
  }
  pointLayer.addTo(map);
  document.getElementById("p-title").textContent=current.title;
  document.getElementById("p-blurb").textContent=current.blurb+" · "+recs.length+" records";
  if(!selected){
    document.getElementById("p-stat").textContent=Object.keys(vals).length+" countries";
    document.getElementById("list").innerHTML=recs.slice(0,12).map(r=>`<li><b>${r.label}</b> — ${r.value??""} ${r.unit||""}</li>`).join("");
  }
}
function openCountry(name,vals,recs){
  const hit=vals[name]||vals[normName(name)];
  document.getElementById("p-title").textContent=name;
  document.getElementById("p-stat").textContent=hit?`${hit.value.toFixed(1)} ${hit.unit||""}`:"No value";
  const rows=recs.filter(r=>r.country===name||normName(r.country)===name);
  document.getElementById("list").innerHTML=(rows.length?rows:[]).slice(0,20).map(r=>`<li><b>${r.label}</b><br>${r.value??""} ${r.unit||""} · ${r.kind||""}</li>`).join("")||"<li>No dossier rows for this country in the active kind.</li>";
}
async function setLayer(meta){
  current=meta;
  const recs=await loadLayer(meta);
  const kinds=kindsFor(recs);
  kind=kinds.includes(meta.defaultKind)?meta.defaultKind:kinds[0];
  document.getElementById("kind-select").innerHTML=kinds.map(k=>`<option value="${k}" ${k===kind?"selected":""}>${k}</option>`).join("");
  document.querySelectorAll(".layers button").forEach(b=>b.classList.toggle("on",b.dataset.id===meta.id));
  const years=[...new Set(recs.map(r=>(r.date&&r.date.year)||r.year).filter(Boolean))].sort();
  document.getElementById("year-label").textContent=years.length?`${years[0]}–${years[years.length-1]}`:"";
  selected=null;
  if(isPhone())setSheet(false);
  paint();
}
async function init(){
  for(const Lr of LAYERS){
    const b=document.createElement("button");b.textContent=Lr.title;b.dataset.id=Lr.id;b.onclick=()=>setLayer(Lr);
    document.getElementById("layers").appendChild(b);
  }
  document.getElementById("kind-select").onchange=e=>{kind=e.target.value;selected=null;paint()};
  window.addEventListener("resize",()=>{map.invalidateSize();if(!isPhone())panel.classList.add("open")});
  if(!isPhone())panel.classList.add("open");
  world=await fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json").then(r=>r.json());
  await setLayer(LAYERS[0]);
}
init();
</script>
</body>
</html>
